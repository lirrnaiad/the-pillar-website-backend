# Test profile configuration - PostgreSQL
# Database connection for tests
# Set these via environment variables or override in your IDE/test runner:
# TEST_DB_URL=jdbc:postgresql://localhost:5432/pillar_test
# TEST_DB_USERNAME=postgres
# TEST_DB_PASSWORD=postgres
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/pillar_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Disable Flyway in tests (let Hibernate create schema)
spring.flyway.enabled=false

# JWT configuration for tests
jwt.secret=test-secret-key-that-is-at-least-32-characters-long-for-hs256-algorithm
jwt.expiration=86400000

# CORS for tests
cors.allowed-origins=http://localhost:5173

